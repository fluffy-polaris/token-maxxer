name: anti-disable-bump

on:
  schedule:
    - cron: "0 0 */30 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.KEEPALIVE_PAT }}

      - name: Empty commit to reset inactivity timer
        run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive bump [skip ci]"
          git push
